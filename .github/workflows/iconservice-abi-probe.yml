name: Build IconServices ABI probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: macos-14
    timeout-minutes: 20
    env:
      THEOS: ${{ github.workspace }}/.theos-toolchain
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: iconservice-abi-diagnostics
      - name: Install build dependencies
        run: |
          brew install ldid xz
          git clone https://github.com/theos/theos.git "$THEOS"
          git -C "$THEOS" checkout dd5c14bb9d91311e221d51b5bfb8c9e5948156db
          sed -i '' 's/-multiply_defined suppress//g' "$THEOS/makefiles/targets/_common/darwin_tail.mk"
          if grep -q -- '-multiply_defined suppress' "$THEOS/makefiles/targets/_common/darwin_tail.mk"; then
            echo "Failed to remove obsolete Theos linker flag" >&2
            exit 1
          fi
          git -C "$THEOS" submodule update --init --recursive
          xcrun clang --version
          xcrun --sdk iphoneos --show-sdk-path
      - name: Build rootless probe with modern arm64e ABI
        run: |
          make -C tools/iconservice-abi-probe clean
          make -C tools/iconservice-abi-probe package THEOS_PACKAGE_SCHEME=rootless
          xcrun lipo -verify_arch arm64 arm64e tools/iconservice-abi-probe/.theos/obj/MarkThemeABIProbe.dylib
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: MarkTheme-ABI-probe-rootless
          path: tools/iconservice-abi-probe/packages/com.hmmzzz.marktheme.abiprobe_0.1.0_iphoneos-arm64.deb
          if-no-files-found: error
          retention-days: 14
